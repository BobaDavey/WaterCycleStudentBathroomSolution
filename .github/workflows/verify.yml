name: Verify classroom data safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL: '0'
      WATERCYCLE_ENVIRONMENT: development
      DATABASE_URL: ''
      MIGRATION_DATABASE_URL: ''
      LOCAL_DATABASE: 'true'
      DEMO_MODE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:fresh
      - run: npm run test:fresh:container
